<!DOCTYPE html>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://code.jquery.com/jquery-1.10.2.js"></script>
<script src="/static/js/treemap.js"></script>
<script src="/static/js/loader.js" defer></script>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // Set before first paint to avoid a flash of the wrong theme.
        (function() {
            var stored = localStorage.getItem('theme');
            var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="/static/css/vanilla-datetimerange-picker.css">
    <link type="text/css" rel="stylesheet" href="/static/css/app.css">
    <title>FINRA Dark Pool Transactions</title>
</head>
<body class="body-main">

<div class="filters">
    <div class="page-header">
        <div>
            <h2>FINRA Dark Pool Transactions</h2>
            <p class="lead">Select a date range for the data</p>
        </div>
        <div class="page-header-actions">
            <a href="/reports" class="nav-link">Reports</a>
            <button id="theme-toggle" class="theme-toggle" type="button"></button>
        </div>
    </div>

    <div class="panel filters-panel">
        <div class="filter-row">
            <div class="filter-field">
                <span class="field-label">Date range</span>
                <input type="text" id="datetimerange-input1" size="40"></input>
            </div>

            <div class="filter-field">
                <span class="field-label">Min short volume %</span>
                <input type="range" min="30" max="70" step="10" value="40" id="percslider">
                <span class="field-value"><span id="minperc"></span>%</span>
            </div>

            <div class="filter-field">
                <span class="field-label">Min daily total volume</span>
                <input type="range" min="1000000" max="10000000" step="500000" id="volslider">
                <span class="field-value"><span id="minvol"></span></span>
            </div>
        </div>

        <div class="filter-field">
            <span class="field-label">ETFs</span>
            <div id="checkboxes"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js" type="text/javascript"></script>
    <script src="/static/js/vanilla-datetimerange-picker.js"></script>
    <script>
        // Range inputs fire oninput on every step crossed while dragging
        // (often a dozen+ times per second), and each call to loadData()
        // does a network round trip plus a full treemap rebuild. Debounce
        // so we only reload once the user pauses, not on every tick.
        function debounce(fn, delayMs) {
            var timeoutId;
            return function() {
                clearTimeout(timeoutId);
                timeoutId = setTimeout(fn, delayMs);
            };
        }
        // loadData() is declared in a later <script> block, so wrap it in
        // a closure rather than pass it directly -- debounce() would
        // otherwise capture `undefined` before that block has run.
        var debouncedLoadData = debounce(function() { loadData(); }, 200);

        var slider = document.getElementById("volslider");
        var output = document.getElementById("minvol");
        output.innerHTML = slider.value;

        slider.oninput = function() {
          output.innerHTML = this.value;
          debouncedLoadData();
        }

        var percslider = document.getElementById("percslider");
        var percoutput = document.getElementById("minperc");
        percoutput.innerHTML = percslider.value;

        percslider.oninput = function() {
          percoutput.innerHTML = this.value;
          debouncedLoadData();
        }
    </script>
    <script>
        var rangeStart;
        var rangeEnd;

        function populateTreemap(startDate, endDate) {
            start = startDate;
            end = endDate;
            minvol = slider.value;
            percshort = percslider.value;
            let checkboxes = document.querySelectorAll('input[name="fund"]:checked');
            let values = [];
            checkboxes.forEach((checkbox) => {
                values.push(checkbox.value);
            });



                document.getElementById("treemap-error").classList.add("hidden");
                fetch('/treemap/'+ start +'/'+ end + '/' + minvol + '/' + percshort + '/' + values)
                    .then(function(response){
                        response.json().then(function(response){
                            renderJSONTreeMap(response);
                            var spinner = document.querySelector(".loader");
                            spinner.classList.add("loader-hidden");
                        })
                    .catch(function(err) {
                        // Was previously silently swapping in a hardcoded
                        // "last 3 days" range and overwriting the visible
                        // date picker with it, unconditionally -- so a
                        // real failure (e.g. the server timing out on a
                        // wide, mostly-uncached range and Render returning
                        // a 502/504 HTML page instead of JSON, which fails
                        // to parse here) looked exactly like the user had
                        // picked a different, much narrower date range.
                        // Surface it instead of masking it.
                        console.error("Failed to load treemap data:", err);
                        var spinner = document.querySelector(".loader");
                        spinner.classList.add("loader-hidden");
                        document.getElementById("treemap-error").textContent =
                            "Couldn't load data for this range. It may be too wide to fetch in one request -- try a smaller range, or try again.";
                        document.getElementById("treemap-error").classList.remove("hidden");
                    })


                })


        }

        var currentModalSymbol = null;

        function populateBarChart(symbol) {
            currentModalSymbol = symbol;
            fetch('/barchart/' + symbol)
                .then(function(response){
                    response.json().then(function(response){
                        renderJSONBarChart(response);
                        var companyName = response.length ? response[0].CompanyName : null;
                        document.getElementById("modal-subtitle").textContent =
                            companyName ? `${symbol} — ${companyName}` : symbol;
                    })
                 })
        }

        function validateCheckboxes() {
              const checkboxes = document.querySelectorAll('input[type="checkbox"]');
              let atLeastOneChecked = false;

              for (let i = 0; i < checkboxes.length; i++) {
                if (checkboxes[i].checked) {
                  atLeastOneChecked = true;
                  break; // No need to continue checking once one is found
                }
              }

              if (!atLeastOneChecked) {
                return false; // Prevent form submission
              }

              return true; // Allow form submission
            }

        const funds = ["SPX","XLB","XLC","XLE","XLF","XLI","XLK","XLP","XLU","XLV","XLY", "XRT","Other"];
        funds.forEach((fund)=>{
            //  generate id
            const id = `fund-${fund}`;

            // create a label
            const label = document.createElement('label');
            label.setAttribute("for", id);

            // create a checkbox
            const checkbox = document.createElement('input');

            checkbox.type = "checkbox";
            checkbox.name = "fund";
            checkbox.value = fund;
            checkbox.id = id;
            checkbox.checked = false;
            if (fund == 'SPX') {
                checkbox.checked = true;
                // checkbox.disabled = true;
            }

            checkbox.addEventListener('click', function() {
                if (validateCheckboxes()) {
                    loadData();
                }
                else {
                     checkbox.checked = true;
                }
            })

            // place the checkbox inside a label
            label.appendChild(checkbox);
            // create text node
            label.appendChild(document.createTextNode(fund));
            // add the label to the root
            document.querySelector("#checkboxes").appendChild(label);
        });
    </script>

    <div class="panel treemap-panel">
        <div id="treemap-error" class="treemap-error hidden"></div>
        <div class="svg" id="svg_container"></div>
    </div>
</div>
<script>
    function loadData() {
        populateTreemap(rangeStart, rangeEnd);
    }

    function loadModal() {
      modal.classList.remove("hidden");
      overlay.classList.remove("hidden");
    }

    // The treemap/bar chart colors are drawn by JS, not CSS, so a theme
    // switch needs an actual re-render to pick up the new palette --
    // theme.js calls this after flipping data-theme, if it's defined.
    function onThemeChange(theme) {
        loadData();
        if (currentModalSymbol && !document.querySelector(".modal").classList.contains("hidden")) {
            populateBarChart(currentModalSymbol);
        }
    }
</script>
<script src="/static/js/theme.js"></script>
</body>

<div class="loader"></div>

<section class="modal hidden">
  <div class="flex">
    <div>
      <h3>Daily Dealer Volume</h3>
      <p id="modal-subtitle"></p>
    </div>
    <button class="btn-close">⨉</button>
  </div>
  <div id="svg_detail"></div>
</section>

<div class="overlay hidden"></div>

<script src="/static/js/barchart.js"></script>
<script>
    $(document).on('loaderEvent', () => {
        var spinner = document.querySelector(".loader");
        spinner.classList.remove("loader-hidden");
    })

    start_date = new Date().toLocaleDateString()
    end_date = new Date().toLocaleDateString()
    daterange = {
        'start_date': start_date,
        'end_date' : end_date
    }
    window.addEventListener("load", function (event) {

        new DateRangePicker('datetimerange-input1',
            {
                timePicker: true,
                maxDate: moment().format('MM/DD/YYYY'),
                opens: 'left',
                ranges: {
                    'Today': [moment().startOf('day'), moment().endOf('day')],
                    'Yesterday': [moment().subtract(1, 'days').startOf('day'), moment().subtract(1, 'days').endOf('day')],
                    'Last 7 Days': [moment().subtract(6, 'days').startOf('day'), moment().endOf('day')],
                    'This Month': [moment().startOf('month').startOf('day'), moment().endOf('month').endOf('day')],
                },
                locale: {
                    format: "MM/DD/YYYY"
                }
            },
            function (start, end) {
                $(document).trigger("loaderEvent");
                    daterange['start_date'] = start.format("YYYYMMDD");
                    daterange['end_date'] = end.format("YYYYMMDD");
                    rangeStart = daterange['start_date']
                    rangeEnd = daterange['end_date']
                    // update data source


                    populateTreemap( daterange['start_date'], daterange['end_date']);
                    var dateElement = document.getElementById("datetimerange-input1");
                    document.getElementById("svg_detail").innerHTML = "";

            })
    });

rangeStart = moment().subtract(6, 'days').startOf('day').format('YYYYMMDD')
rangeEnd = moment().endOf('day').format('YYYYMMDD')
populateTreemap(rangeStart, rangeEnd)

</script>
</html>

<script>

const modal = document.querySelector(".modal");
const overlay = document.querySelector(".overlay");
const closeModalBtn = document.querySelector(".btn-close");

// close modal function
const closeModal = function () {
  modal.classList.add("hidden");
  overlay.classList.add("hidden");
};

// close the modal when the close button and overlay is clicked
closeModalBtn.addEventListener("click", closeModal);
overlay.addEventListener("click", closeModal);

// close modal when the Esc key is pressed
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && !modal.classList.contains("hidden")) {
    closeModal();
  }
});

</script>
