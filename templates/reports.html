<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // Set before first paint to avoid a flash of the wrong theme.
        (function() {
            var stored = localStorage.getItem('theme');
            var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="/static/css/app.css">
    <title>Reports &mdash; FINRA Off-Exchange Short Volume</title>
</head>
<body class="body-main">

<div class="filters">
    <div class="page-header">
        <div>
            <h2>Reports</h2>
            <p class="lead">Run saved database queries against the FINRA dataset</p>
        </div>
        <div class="page-header-actions">
            <a href="/" class="nav-link">&larr; Dashboard</a>
            <button id="theme-toggle" class="theme-toggle" type="button"></button>
        </div>
    </div>

    <div class="panel reports-panel">
        <div class="report-tabs" id="report-tabs">
            {% for key, report in reports.items() %}
            <button type="button" class="report-tab" data-report="{{ key }}">{{ report.label }}</button>
            {% endfor %}
        </div>

        <p class="report-description" id="report-description"></p>

        <form class="report-form" id="report-form">
            <div class="report-form-fields" id="report-form-fields"></div>
            <button type="submit" class="btn-run">Run report</button>
        </form>
    </div>

    <div class="panel results-panel">
        <div id="report-status" class="report-status"></div>
        <div class="report-table-wrap">
            <table id="report-table" class="report-table"></table>
        </div>
    </div>
</div>

<section class="modal hidden">
  <div class="flex">
    <div>
      <h3>Daily Off-Exchange Volume</h3>
      <p id="modal-subtitle"></p>
    </div>
    <button class="btn-close">⨉</button>
  </div>
  <div id="svg_detail"></div>
</section>

<div class="overlay hidden"></div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="/static/js/barchart.js"></script>
<script>
    // Embeds the report registry so the frontend can build forms without
    // a separate round trip.
    var REPORTS = {{ reports | tojson }};
</script>
<script src="/static/js/publish-time.js"></script>
<script src="/static/js/reports.js"></script>
<script src="/static/js/theme.js"></script>
<script>
    // Drill-down modal for a report row's symbol -- its own trailing
    // 30-day trend leading up to the flagged date, fetched fresh (not
    // from any cache) since a report result isn't a wide date-range fetch
    // the way the main treemap page's is.
    const modal = document.querySelector(".modal");
    const overlay = document.querySelector(".overlay");
    const closeModalBtn = document.querySelector(".btn-close");

    function loadModal() {
        modal.classList.remove("hidden");
        overlay.classList.remove("hidden");
    }

    const closeModal = function () {
        modal.classList.add("hidden");
        overlay.classList.add("hidden");
    };

    closeModalBtn.addEventListener("click", closeModal);
    overlay.addEventListener("click", closeModal);

    document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && !modal.classList.contains("hidden")) {
            closeModal();
        }
    });

    // dateYYYYMMDD: the row's own date value, not necessarily "today" --
    // the window is always the 30 days trailing that specific date.
    function populateSymbolModal(symbol, dateYYYYMMDD) {
        loadModal();
        fetch('/reports/symbol_detail/' + symbol + '/' + dateYYYYMMDD)
            .then(function(response) { return response.json(); })
            .then(function(data) {
                renderJSONBarChart(data);
                var companyName = data.length ? data[0].CompanyName : null;
                document.getElementById("modal-subtitle").textContent =
                    companyName ? `${symbol} — ${companyName}` : symbol;
            });
    }
</script>
</body>
</html>
